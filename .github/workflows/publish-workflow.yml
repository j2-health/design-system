name: Publish to npm

# Publishes @j2-health/design-system when a version tag (v1.2.3) is pushed.
# Release procedure: see "Publishing to npm" in README.md.
# Requires the NPM_TOKEN repository secret (an npm automation token with
# publish rights on the @j2-health org).

on:
  push:
    tags:
      - 'v*'
  # Manual fallback: publishes whatever version package.json declares on the
  # chosen ref (npm rejects duplicate versions, so re-runs are safe).
  workflow_dispatch:

jobs:
  # Runs the same packed-tarball check as pull requests, so the artifact that
  # reaches npm is the one that was validated. Without this the release path
  # skipped every check that consumes the package the way a consumer does.
  smoke-test:
    name: Package smoke test
    uses: ./.github/workflows/package-smoke-test.yml

  publish:
    name: Publish package
    runs-on: ubuntu-latest
    needs: smoke-test
    # A manual dispatch skips the tag/version check below, so restrict it to
    # refs a release can legitimately come from. Without this, dispatching
    # from a feature branch publishes that branch's version as `latest`.
    if: github.ref_type == 'tag' || github.ref_name == 'main'
    permissions:
      contents: read
      # For npm provenance attestation (--provenance)
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "$pkg_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run type-check

      # Built in its own step, with no npm token in the environment. The
      # publish step then runs with --ignore-scripts so prepublishOnly (and
      # every build plugin it loads) never sees NODE_AUTH_TOKEN.
      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
