name: Publish to npm

# Publishes @j2-health/design-system. The primary route is automatic: a merge
# to `main` that changes `version` in package.json publishes and tags that
# version. A manual run on `main` and pushing a version tag (v1.2.3) publish
# too.
# Release procedure: see "Publishing to npm" in README.md.
#
# Authenticates with npm through trusted publishing (OIDC) — there is no
# publish token anywhere. npm is configured to trust this repository and THIS
# WORKFLOW FILE BY NAME, so renaming or moving this file breaks publishing
# until the trusted publisher is updated on npmjs.com to match.
#
# Requires npm >= 11.5.1 and Node >= 22.14.0; .node-version pins 24.5.0, which
# ships npm 11.5.1 exactly. A downgrade of .node-version below that silently
# removes OIDC support, so the publish step asserts the version rather than
# failing later with an auth error.

on:
  push:
    # Primary route. `paths` narrows it to merges that touch package.json, and
    # the `detect` job then publishes only if `version` itself changed -- a
    # dependency bump edits package.json too. Path filters are not evaluated
    # for tag pushes, so the tag route below is unaffected.
    branches:
      - main
    paths:
      - package.json
    tags:
      - 'v*'
  # Manual fallback: publishes whatever version package.json declares on the
  # chosen ref, then tags that version so every published release still has a
  # matching tag. Re-running is safe for the publish step -- npm rejects a
  # duplicate version -- but see the `tag` job for how to recover when publish
  # succeeded and tagging did not.
  workflow_dispatch:

# Two merges landing close together must not publish concurrently; queue them.
concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  # Decides whether this run releases at all. A tag push or a manual dispatch
  # is an explicit request, so it always proceeds. A push to `main` proceeds
  # only when the merge changed `version` and that version is not on npm yet --
  # the second check keeps a merge from going red when someone already
  # dispatched the release by hand.
  detect:
    name: Detect version bump
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref_type == 'branch'
        with:
          fetch-depth: 2

      - name: Check whether the version changed
        id: check
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" != push ] || [ "$GITHUB_REF_TYPE" != branch ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          name="$(node -p "require('./package.json').name")"
          after="$(node -p "require('./package.json').version")"

          # `before` is the previous tip of main. Fetch it explicitly: a merge
          # commit or a multi-commit push puts it beyond fetch-depth 2.
          git fetch --no-tags --depth=1 origin "$BEFORE"
          before="$(git show "$BEFORE:package.json" | node -p "JSON.parse(require('fs').readFileSync(0)).version")"

          if [ "$before" = "$after" ]; then
            echo "version unchanged at $after; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # `npm view` exits non-zero for a version that does not exist (E404),
          # which is the expected case here. --prefer-online skips npm's
          # metadata cache, which can lag a fresh publish by minutes. Any other
          # failure also reads as "not published", which is the safe direction:
          # publish then fails loudly on the duplicate instead of skipping.
          if npm view --prefer-online "$name@$after" version >/dev/null 2>&1; then
            echo "$name@$after is already on npm; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "version $before -> $after; releasing"
          echo "release=true" >> "$GITHUB_OUTPUT"

  # Runs the same packed-tarball check as pull requests, so the artifact that
  # reaches npm is the one that was validated. Without this the release path
  # skipped every check that consumes the package the way a consumer does.
  smoke-test:
    name: Package smoke test
    needs: detect
    if: needs.detect.outputs.release == 'true'
    uses: ./.github/workflows/package-smoke-test.yml

  publish:
    name: Publish package
    runs-on: ubuntu-latest
    needs: smoke-test
    # A manual dispatch skips the tag/version check below, so restrict it to
    # refs a release can legitimately come from. Without this, dispatching
    # from a feature branch publishes that branch's version as `latest`.
    if: github.ref_type == 'tag' || github.ref_name == 'main'
    permissions:
      contents: read
      # Mints the OIDC token that authenticates to npm, and signs provenance.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          cache: npm
          cache-dependency-path: package-lock.json
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "$pkg_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version" >&2
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Type-check
        run: npm run type-check

      # Built in its own step so publish can run with --ignore-scripts:
      # prepublishOnly (and every build plugin it loads) then never executes
      # in the step holding the OIDC credential.
      - name: Build
        run: npm run build

      # Trusted publishing needs npm >= 11.5.1. Below that npm ignores OIDC and
      # falls back to token auth, which would fail here with a confusing 401
      # rather than naming the real cause.
      - name: Verify npm supports trusted publishing
        run: |
          npm --version
          node -e "
            const [maj, min, pat] = require('child_process')
              .execSync('npm --version').toString().trim().split('.').map(Number)
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)))
            if (!ok) throw new Error('npm >= 11.5.1 required for trusted publishing')
          "

      # Refuse before publishing, not after. A tag for this version already
      # pointing at a different commit means the release is inconsistent, and
      # npm publish cannot be undone -- so the only useful place to catch it is
      # here. Reachable when a tag-push release pushed its tag but failed
      # before publishing, `main` then advanced, and someone dispatches: npm
      # would get the newer commit while the tag kept the older one.
      #
      # On a tag-push run this is trivially satisfied -- the tag that triggered
      # the run points at GITHUB_SHA by definition.
      - name: Refuse if this version is already tagged elsewhere
        run: |
          set -euo pipefail
          version="v$(node -p "require('./package.json').version")"

          # Fail closed. `ls-remote` exits 0 with no output when the tag simply
          # does not exist, and non-zero when it could not reach origin at all.
          # Swallowing the second into "untagged" would quietly disable this
          # guard on a transient network error -- which is the one moment it
          # most needs to hold, since the next step cannot be undone.
          if ! refs="$(git ls-remote --tags origin "refs/tags/$version^{}" "refs/tags/$version")"; then
            echo "::error::Could not read tags from origin; refusing to publish unchecked."
            exit 1
          fi

          # Annotated tags list a peeled `^{}` line carrying the commit;
          # lightweight ones carry it on the plain line. This repo has both
          # (v0.2.1 annotated, v0.2.0 lightweight), so prefer peeled.
          existing="$(printf '%s\n' "$refs" | awk '/\^\{\}$/{print $1; exit}')"
          [ -n "$existing" ] || existing="$(printf '%s\n' "$refs" | awk 'NF{print $1; exit}')"

          if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
            echo "::error::$version already tags $existing, but this run would publish $GITHUB_SHA."
            echo "::error::Bump the version, or move the tag if it is the one that is wrong."
            exit 1
          fi

      # No NODE_AUTH_TOKEN: authentication is OIDC via trusted publishing, and
      # provenance is generated automatically, so --provenance is not passed.
      - name: Publish
        run: npm publish --ignore-scripts

  # A tag-triggered release already has its tag — that tag is what started the
  # run. A merge to main or a manual dispatch does not, so without this it would publish a version
  # that git has no record of, and `git tag -l` would stop being an honest list
  # of what is on npm.
  #
  # Separate job, deliberately: pushing a tag needs `contents: write`, and the
  # publish job holds the npm OIDC credential. Keeping them apart means the job
  # that can write to the repo never sees that credential, and the job that
  # publishes stays `contents: read`.
  #
  # If publish succeeded but this job failed, recover with "Re-run failed jobs".
  # NOT "Re-run all jobs" -- that restarts publish, which npm rejects as a
  # duplicate version, and this job is skipped behind the failure. Tagging by
  # hand also works: git tag -a vX.Y.Z -m vX.Y.Z && git push origin vX.Y.Z
  tag:
    name: Tag the published version
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref_type == 'branch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Annotated, not lightweight: `git push --follow-tags` skips lightweight
      # tags silently, so a lightweight one here would leave anyone later
      # pushing tags by hand with a release that never reaches the remote.
      #
      # Pushed with GITHUB_TOKEN, which by design does not start another
      # workflow run -- so this cannot re-trigger the publish above.
      - name: Tag the released version
        run: |
          set -euo pipefail

          version="v$(node -p "require('./package.json').version")"

          # Same fail-closed read as the publish job's guard: a non-zero exit
          # means origin was unreachable, not that the tag is absent.
          if ! refs="$(git ls-remote --tags origin "refs/tags/$version^{}" "refs/tags/$version")"; then
            echo "::error::Could not read tags from origin; refusing to tag unchecked."
            exit 1
          fi

          # Peeled `^{}` line for an annotated tag, plain line for a lightweight
          # one -- this repo has both (v0.2.1 annotated, v0.2.0 lightweight).
          existing="$(printf '%s\n' "$refs" | awk '/\^\{\}$/{print $1; exit}')"
          [ -n "$existing" ] || existing="$(printf '%s\n' "$refs" | awk 'NF{print $1; exit}')"

          if [ -n "$existing" ]; then
            # Name match is not enough. The publish job already refuses this
            # case before publishing, so reaching it here means the tag moved
            # mid-run -- still worth failing rather than reporting success for
            # a tag this run did not create.
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::$version already exists at $existing, but $GITHUB_SHA was published"
              exit 1
            fi
            echo "$version is already tagged at the published commit; nothing to do"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$version" -m "$version"
          git push origin "$version"
